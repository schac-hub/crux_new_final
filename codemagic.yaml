workflows:
  android-release:
    name: Android Release - CRUX

    instance_type: linux_x2

    max_build_duration: 120

    environment:
      flutter: 3.47.2
      java: 17

      groups:
        - firebase_credentials

      vars:
        LIVEKIT_WSS_URL: "wss://crux-88fihb12.livekit.cloud"
        LIVEKIT_SANDBOX_ID: "crux-6l6num"

        FIREBASE_PROJECT_ID: "crux-3c6be"
        APP_BASE_URL: "https://crux-3c6be.web.app"

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:

      - name: Clean Flutter project
        script: |
          flutter clean
          rm -rf pubspec.lock
          flutter pub get

          echo "=== FLUTTER ==="
          flutter --version

          echo "=== DEPENDENCIES ==="
          flutter pub deps | grep -E "livekit_client|flutter_webrtc|path"

      - name: Configure Flutter SDK
        script: |
          FLUTTER_SDK=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")

          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

          echo "Flutter SDK:"
          cat android/local.properties

      - name: Configure Android signing
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

          echo "key.properties configured"

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name=2.38.1 \
            --build-number=240 \
            --dart-define=LIVEKIT_WSS_URL="$LIVEKIT_WSS_URL" \
            --dart-define=LIVEKIT_SANDBOX_ID="$LIVEKIT_SANDBOX_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=2.38.1 \
            --build-number=240 \
            --dart-define=LIVEKIT_WSS_URL="$LIVEKIT_WSS_URL" \
            --dart-define=LIVEKIT_SANDBOX_ID="$LIVEKIT_SANDBOX_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=APP_BASE_URL="$APP_BASE_URL"

      - name: Copy release artifacts
        script: |
          mkdir -p build/outputs

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/outputs/crux-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            build/outputs/crux-release.aab

          ls -lh build/outputs/

    artifacts:
      - build/outputs/crux-release.apk
      - build/outputs/crux-release.aab

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com

        notify:
          success: true
          failure: true

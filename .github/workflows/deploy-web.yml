name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ schac ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Aligné sur Codemagic (3.47.2) et sur le lockfile (Dart ≥ 3.12,
        # Flutter ≥ 3.44) : l'ancien pin 3.32.8 rendait le pub get
        # incompatible → build web cassé déployé (pages blanches, spinners).
        flutter-version: '3.47.2'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get --enforce-lockfile

    - name: Analyze
      run: flutter analyze

    - name: Build web app
      run: |
        # CORRIGÉ (bug #12) : LIVEKIT_WSS_URL aligné sur le sandbox ID crux-6l6num
        # --pwa-strategy=none : PAS de service worker Flutter — il servait
        # l'ancienne version en cache aux visiteurs même après déploiement.
        # web/flutter_service_worker.js (stub de neutralisation) est déployé
        # à la place pour désinstaller le SW existant des navigateurs.
        flutter build web --release --pwa-strategy=none \
          --base-href /crux_new_final/ \
          --dart-define=LIVEKIT_WSS_URL="wss://crux-6l6num.sandbox.livekit.io" \
          --dart-define=LIVEKIT_SANDBOX_ID="crux-6l6num" \
          --dart-define=LIVEKIT_TOKEN_SERVER_URL="https://cloud-api.livekit.io/api/sandbox/connection-details" \
          --dart-define=FIREBASE_PROJECT_ID="crux-3c6be"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy Flutter web to GitHub Pages'

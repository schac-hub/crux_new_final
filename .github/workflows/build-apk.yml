name: Build and Release

on:
  push:
    branches: [ main, schac ]
  pull_request:
    branches: [ main, schac ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0-rc1" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          LIVEKIT_WSS_URL: ${{ secrets.LIVEKIT_WSS_URL }}
          LIVEKIT_TOKEN_SERVER_URL: ${{ secrets.LIVEKIT_TOKEN_SERVER_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-name=2.38.1 \
            --build-number=${{ github.run_number }} \
            --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=APP_BASE_URL="${APP_BASE_URL}"

      - name: Build Release AAB
        env:
          LIVEKIT_WSS_URL: ${{ secrets.LIVEKIT_WSS_URL }}
          LIVEKIT_TOKEN_SERVER_URL: ${{ secrets.LIVEKIT_TOKEN_SERVER_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --build-name=2.38.1 \
            --build-number=${{ github.run_number }} \
            --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=APP_BASE_URL="${APP_BASE_URL}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crux-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: crux-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/schac')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.38.1-${{ github.run_number }}
          name: Release v2.38.1 build ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build and Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/schac')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        env:
          LIVEKIT_WSS_URL: ${{ secrets.LIVEKIT_WSS_URL }}
          LIVEKIT_TOKEN_SERVER_URL: ${{ secrets.LIVEKIT_TOKEN_SERVER_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          flutter build web --release --base-href /crux_new_final/ \
            --dart-define=LIVEKIT_WSS_URL="${LIVEKIT_WSS_URL}" \
            --dart-define=LIVEKIT_TOKEN_SERVER_URL="${LIVEKIT_TOKEN_SERVER_URL}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --dart-define=APP_BASE_URL="${APP_BASE_URL}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Flutter web to GitHub Pages'

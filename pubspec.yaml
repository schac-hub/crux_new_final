name: crux_new_final
description: "CRUX — Vidéoconférence avec LiveKit."
publish_to: "none"

version: 2.39.0+241

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0 
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.6.2
  firebase_storage: ^12.0.0

  # LiveKit
  livekit_client: ^2.6.4

  # Google
  google_sign_in: ^6.2.2

  # Network
  http: ^1.2.2
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  app_links: ^6.3.3
  connectivity_plus: ^7.0.0

  # Internationalization
  intl: 0.20.2

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5

  # Images
  image_picker: ^1.1.2
  camera: ^0.11.1
  file_picker: ^8.1.6

  # State management
  provider: ^6.1.5

  # Utilities
  path: ^1.9.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Logging
  logger: ^2.4.0

  # Crypto (hash passcode réunions)
  crypto: ^3.0.6

  # Device / application information
  device_info_plus: ^12.4.0
  package_info_plus: ^8.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
